[package]
name = "gpx-tool"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
png = "0.18.1"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
tray-icon = { version = "0.26.1", default-features = false }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true
strip = false

[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
